<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gomoku · IA Extrême</title>

<style>
:root {
  --paper:#f3e9d2; --shade:#e6d5ae; --wood:#e2c48d;
  --ink:#8b0000; --text:#2b1d14; --size:min(92vw,560px);
}
* { box-sizing:border-box }
body {
  margin:0; min-height:100vh; padding:20px 0 28px;
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:16px; color:var(--text);
  font-family:Georgia,serif;
  background:
    radial-gradient(circle at 20% 10%,#fbf5e6,transparent 55%),
    radial-gradient(circle at 80% 90%,var(--shade),transparent 60%),
    var(--paper);
}
header,.hint { text-align:center }
h1 { margin:0; color:var(--ink); font-size:1.8rem; letter-spacing:.2em }
h1 small {
  display:block; margin-top:4px; color:var(--text);
  font-size:.45em; letter-spacing:.15em; opacity:.7;
}
.controls,.actions { display:flex; flex-wrap:wrap; justify-content:center; gap:8px }
.control {
  display:flex; align-items:center; gap:7px; padding:7px 10px;
  border:1px solid #8b000059; border-radius:99px;
  background:#ffffff59; font-size:.9rem;
}
select { border:0; background:transparent; color:inherit; font:inherit }
button:focus-visible,select:focus-visible { outline:3px solid #b56828; outline-offset:3px }
.status {
  min-height:3.2em; display:flex; align-items:center;
  justify-content:center; gap:12px; padding:8px 20px;
  border:1px solid var(--ink); border-radius:99px;
  background:#ffffff73; text-align:center;
}
.status.win { background:var(--ink); color:#fbf1d9 }
.status.thinking { background:#8b00001a }
.dot {
  flex:none; width:16px; height:16px; border-radius:50%;
  box-shadow:0 1px 3px #0006;
}
.dot.black,.stone.black { background:radial-gradient(circle at 35% 30%,#707070,#151515 55%,#000) }
.dot.white,.stone.white { background:radial-gradient(circle at 35% 30%,#fff,#ececec 55%,#bdbdbd) }
.dot.white { border:1px solid #aaa }
#board {
  width:var(--size); height:var(--size); display:grid;
  grid-template:repeat(15,1fr)/repeat(15,1fr);
  background:linear-gradient(135deg,#ffffff40,transparent 50%),var(--wood);
  border:3px solid var(--ink); border-radius:6px;
  box-shadow:0 18px 40px #3c1e0a4d; touch-action:manipulation;
}
.cell {
  position:relative; min-width:0; min-height:0; padding:0; margin:0;
  border:0; background:transparent; cursor:pointer;
}
.cell::before,.cell::after {
  content:""; position:absolute; background:var(--ink);
  opacity:.75; pointer-events:none;
}
.cell::before { left:0; right:0; top:50%; height:1px }
.cell::after { top:0; bottom:0; left:50%; width:1px }
.cell.left::before { left:50% }
.cell.right::before { right:50% }
.cell.top::after { top:50% }
.cell.bottom::after { bottom:50% }
.hoshi {
  position:absolute; left:50%; top:50%; width:22%; height:22%;
  transform:translate(-50%,-50%); background:var(--ink); border-radius:50%;
}
.ghost,.stone { position:absolute; inset:9%; border-radius:50%; pointer-events:none }
.ghost { z-index:1; opacity:0; transition:opacity .18s }
#board[data-turn="black"] .ghost { background:#111 }
#board[data-turn="white"] .ghost { background:#fff; box-shadow:0 0 0 1px #0004 }
#board:not(.over):not(.thinking) .cell:not(.taken):is(:hover,:focus-visible) .ghost { opacity:.35 }
.stone { z-index:2; animation:drop .3s both; box-shadow:0 3px 5px #0006 }
.stone.last::after {
  content:""; position:absolute; left:50%; top:50%; width:22%; height:22%;
  transform:translate(-50%,-50%); background:var(--ink); border-radius:50%;
}
.stone.win { animation:drop .3s both,pulse 1.1s ease-in-out .4s infinite }
.action {
  padding:10px 22px; border:2px solid var(--ink); border-radius:99px;
  background:#ffffff2e; color:var(--ink); font:inherit; cursor:pointer;
}
.action:hover:not(:disabled) { background:var(--ink); color:#fbf1d9 }
.action:disabled { opacity:.5; cursor:default }
.hint { max-width:600px; padding:0 16px; font-size:.85rem; opacity:.78 }
@keyframes drop {
  from { opacity:0; transform:translateY(-18px) scale(1.25) }
  to { opacity:1; transform:translateY(0) scale(1) }
}
@keyframes pulse {
  0%,100% { box-shadow:0 0 0 0 #8b0000b3 }
  50% { box-shadow:0 0 0 6px #8b000000 }
}
@media (prefers-reduced-motion:reduce) {
  .stone,.stone.win { animation:none }
  .ghost { transition:none }
}
</style>
</head>

<body>
<header>
  <h1>五子棋<small>Gomoku · IA Extrême</small></h1>
</header>

<div class="controls">
  <label class="control">Vous jouez
    <select id="humanColor">
      <option value="black">Noir · premier</option>
      <option value="white">Blanc · second</option>
    </select>
  </label>
  <label class="control">Difficulté
    <select id="difficulty">
      <option value="normal">Stratégique</option>
      <option value="hard" selected>Extrême</option>
    </select>
  </label>
</div>

<div id="status" class="status" role="status" aria-live="polite"></div>
<div id="board" data-turn="black" role="group" aria-label="Plateau de Gomoku"></div>
<div id="hint" class="hint">Alignez au moins cinq pierres pour gagner.</div>

<div class="actions">
  <button id="restart" class="action" type="button">Recommencer</button>
  <button id="undo" class="action" type="button">Annuler</button>
</div>

<script>
(() => {
  "use strict";

  // Configuration
  const SIZE = 15, BLACK = 1, WHITE = 2, WIN = 1e9;
  const DIRS = [[0,1],[1,0],[1,1],[1,-1]];
  const STARS = new Set(["3,3","3,11","7,7","11,3","11,11"]);
  const LEVELS = {
    normal: { depth:4, time:300, width:10 },
    hard:   { depth:8, time:1500, width:14 }
  };
  const $ = id => document.getElementById(id);
  const ui = {
    board:$("board"), status:$("status"), hint:$("hint"),
    color:$("humanColor"), level:$("difficulty"),
    restart:$("restart"), undo:$("undo")
  };
  const cells = [];
  const state = {
    grid:[], history:[], turn:BLACK, human:BLACK, ai:WHITE,
    over:false, thinking:false, winner:0, line:[],
    token:0, timer:null
  };
  const opposite = color => 3 - color;
  const colorName = color => color === BLACK ? "black" : "white";
  const inside = (r,c) => r >= 0 && r < SIZE && c >= 0 && c < SIZE;

  // Plateau et interface
  function buildBoard() {
    const fragment = document.createDocumentFragment();

    for (let r = 0; r < SIZE; r++) {
      cells[r] = [];

      for (let c = 0; c < SIZE; c++) {
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "cell";
        cell.dataset.r = r;
        cell.dataset.c = c;

        if (!r) cell.classList.add("top");
        if (!c) cell.classList.add("left");
        if (r === SIZE - 1) cell.classList.add("bottom");
        if (c === SIZE - 1) cell.classList.add("right");

        cell.innerHTML =
          (STARS.has(`${r},${c}`) ? '<span class="hoshi"></span>' : "") +
          '<span class="ghost"></span>';

        cell.setAttribute("aria-label", `Ligne ${r + 1}, colonne ${c + 1}, vide`);
        fragment.appendChild(cell);
        cells[r][c] = cell;
      }
    }

    ui.board.appendChild(fragment);
    ui.board.addEventListener("click", event => {
      const cell = event.target.closest(".cell");
      if (cell) playHuman(Number(cell.dataset.r), Number(cell.dataset.c));
    });
  }

  function renderBoard() {
    const last = state.history.at(-1);
    const winning = new Set(state.line.map(([r,c]) => `${r},${c}`));

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const cell = cells[r][c], color = state.grid[r][c];
        let stone = cell.querySelector(".stone");

        cell.classList.toggle("taken", !!color);
        cell.setAttribute("aria-label",
          `Ligne ${r + 1}, colonne ${c + 1}, ${color ? color === BLACK ? "noir" : "blanc" : "vide"}`);

        if (!color) {
          stone?.remove();
          continue;
        }

        if (!stone) {
          stone = document.createElement("span");
          cell.appendChild(stone);
        }

        stone.className = `stone ${colorName(color)}`;
        stone.classList.toggle("last", last?.r === r && last?.c === c);
        stone.classList.toggle("win", winning.has(`${r},${c}`));
      }
    }
  }

  function renderStatus() {
    const { over, thinking, winner, turn, human, ai, history } = state;
    const color = winner || (thinking ? ai : turn);
    let message = thinking ? "L’IA réfléchit…" :
      turn === human ? "À vous de jouer" : "Tour de l’ordinateur";

    if (over) message = winner ? winner === human ? "Victoire !" : "L’IA gagne." : "Match nul";

    ui.status.classList.toggle("win", !!winner);
    ui.status.classList.toggle("thinking", thinking);
    ui.status.innerHTML =
      `<span class="dot ${colorName(color)}" aria-hidden="true"></span><span>${message}</span>`;

    ui.board.dataset.turn = colorName(turn);
    ui.board.classList.toggle("over", over);
    ui.board.classList.toggle("thinking", thinking);
    ui.board.setAttribute("aria-busy", String(thinking));
    ui.undo.disabled = !history.length;
    ui.hint.textContent = over
      ? winner ? "Partie terminée. Recommencez ou annulez le dernier tour." : "Le plateau est rempli."
      : "Alignez au moins cinq pierres. Le point rouge indique le dernier coup.";
  }

  function cancelPending() {
    state.token++;
    clearTimeout(state.timer);
    state.timer = null;
    state.thinking = false;
  }

  function reset() {
    cancelPending();
    Object.assign(state, {
      grid:Array.from({ length:SIZE }, () => Array(SIZE).fill(0)),
      history:[], turn:BLACK, over:false, winner:0, line:[],
      human:ui.color.value === "black" ? BLACK : WHITE
    });
    state.ai = opposite(state.human);
    renderBoard();
    renderStatus();
    if (state.turn === state.ai) scheduleAI();
  }

  // Règles
  function winningLine(r,c,color) {
    for (const [dr,dc] of DIRS) {
      const line = [[r,c]];

      for (const sign of [-1,1]) {
        let nr = r + dr * sign, nc = c + dc * sign;

        while (inside(nr,nc) && state.grid[nr][nc] === color) {
          if (sign < 0) line.unshift([nr,nc]);
          else line.push([nr,nc]);
          nr += dr * sign;
          nc += dc * sign;
        }
      }

      if (line.length >= 5) return line;
    }
    return null;
  }

  function commitMove(r,c) {
    if (state.over || !inside(r,c) || state.grid[r][c]) return false;

    const color = state.turn;
    state.grid[r][c] = color;
    state.history.push({ r,c,color });
    state.line = winningLine(r,c,color) || [];
    state.winner = state.line.length ? color : 0;
    state.over = !!state.winner || state.history.length === SIZE * SIZE;

    if (!state.over) state.turn = opposite(color);
    renderBoard();
    renderStatus();
    return true;
  }

  function playHuman(r,c) {
    if (state.thinking || state.turn !== state.human) return;
    if (commitMove(r,c) && !state.over) scheduleAI();
  }

  function undo() {
    if (!state.history.length) return;
    cancelPending();

    const history = state.history;
    const count = history.at(-1).color === state.ai && history.length > 1 ? 2 : 1;

    for (let i = 0; i < count; i++) {
      const move = history.pop();
      state.grid[move.r][move.c] = 0;
    }

    Object.assign(state, {
      over:false, winner:0, line:[],
      turn:history.length ? opposite(history.at(-1).color) : BLACK
    });

    renderBoard();
    renderStatus();
    if (state.turn === state.ai) scheduleAI();
  }

  function scheduleAI() {
    if (state.over || state.turn !== state.ai) return;

    state.thinking = true;
    const token = ++state.token;
    renderStatus();

    state.timer = setTimeout(() => {
      if (token !== state.token) return;
      state.timer = null;

      try {
        const move = chooseMove();
        if (token !== state.token) return;
        state.thinking = false;
        if (move) commitMove(move.r,move.c);
      } catch (error) {
        state.thinking = false;
        console.error("Erreur du moteur Gomoku :", error);
        const fallback = candidates()[0];
        if (fallback) commitMove(fallback.r,fallback.c);
      } finally {
        renderStatus();
      }
    }, 50);
  }

  // Évaluation : les deux joueurs utilisent la même échelle.
   function lineScore(length,open) {
    if (length >= 5) return WIN;
    if (!open) return 0;
    if (length === 4) return open === 2 ? 120000 : 18000;
    if (length === 3) return open === 2 ? 3500 : 300;
    if (length === 2) return open === 2 ? 120 : 25;
    return open === 2 ? 8 : 1;
  }

  function evaluate(color) {
    let total = 0;
    const grid = state.grid;

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const owner = grid[r][c];
        if (!owner) continue;

        const sign = owner === color ? 1 : -1;

        for (const [dr,dc] of DIRS) {
          const pr = r - dr, pc = c - dc;
          if (inside(pr,pc) && grid[pr][pc] === owner) continue;

          let nr = r, nc = c, length = 0;

          while (inside(nr,nc) && grid[nr][nc] === owner) {
            length++;
            nr += dr;
            nc += dc;
          }

          const open =
            Number(inside(pr,pc) && !grid[pr][pc]) +
            Number(inside(nr,nc) && !grid[nr][nc]);

          total += sign * lineScore(length,open);
        }
      }
    }

    return total;
  }

  function candidates() {
    const positions = new Set(), grid = state.grid;

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) continue;

        for (let dr = -2; dr <= 2; dr++) {
          for (let dc = -2; dc <= 2; dc++) {
            const nr = r + dr, nc = c + dc;

            if (inside(nr,nc) && !grid[nr][nc]) {
              positions.add(nr * SIZE + nc);
            }
          }
        }
      }
    }

    return [...positions].map(index => ({
      r:Math.floor(index / SIZE),
      c:index % SIZE
    }));
  }

  function winsAt(r,c,color) {
    const grid = state.grid;
    grid[r][c] = color;

    try {
      for (const [dr,dc] of DIRS) {
        let length = 1;

        for (const sign of [-1,1]) {
          let nr = r + dr * sign, nc = c + dc * sign;

          while (inside(nr,nc) && grid[nr][nc] === color) {
            length++;
            nr += dr * sign;
            nc += dc * sign;
          }
        }

        if (length >= 5) return true;
      }

      return false;
    } finally {
      grid[r][c] = 0;
    }
  }

  function potential(r,c,color) {
    const grid = state.grid;
    let score = 0;
    grid[r][c] = color;

    try {
      for (const [dr,dc] of DIRS) {
        let length = 1, open = 0;

        for (const sign of [-1,1]) {
          let nr = r + dr * sign, nc = c + dc * sign;

          while (inside(nr,nc) && grid[nr][nc] === color) {
            length++;
            nr += dr * sign;
            nc += dc * sign;
          }

          if (inside(nr,nc) && !grid[nr][nc]) open++;
        }

        score += lineScore(length,open);
      }

      return score;
    } finally {
      grid[r][c] = 0;
    }
  }

  function orderedMoves(color,width,list = candidates()) {
    const wins = list.filter(m => winsAt(m.r,m.c,color));
    if (wins.length) return wins;

    const opponent = opposite(color);
    const blocks = list.filter(m => winsAt(m.r,m.c,opponent));
    if (blocks.length) return blocks;

    return list.map(move => ({
      ...move,
      score:
        potential(move.r,move.c,color) +
        potential(move.r,move.c,opponent) * 1.15 -
        Math.abs(move.r - 7) -
        Math.abs(move.c - 7)
    }))
    .sort((a,b) => b.score - a.score)
    .slice(0,width);
  }

  const TIMEOUT = Symbol("timeout");
  let deadline = 0, searchWidth = 0;

  function checkTime() {
    if (performance.now() >= deadline) throw TIMEOUT;
  }

  function negamax(depth,alpha,beta,color,ply) {
    checkTime();

    const list = candidates();
    if (!list.length) return 0;

    if (list.some(m => winsAt(m.r,m.c,color))) {
      return WIN - ply;
    }

    const threats = list.filter(
      m => winsAt(m.r,m.c,opposite(color))
    );

    if (threats.length > 1) return -WIN + ply + 1;
    if (depth <= 0) return evaluate(color);

    const moves = threats.length
      ? threats
      : orderedMoves(color,searchWidth,list);

    let best = -Infinity;

    for (const move of moves) {
      checkTime();
      state.grid[move.r][move.c] = color;
      let score;

      try {
        score = -negamax(
          depth - 1,-beta,-alpha,opposite(color),ply + 1
        );
      } finally {
        state.grid[move.r][move.c] = 0;
      }

      best = Math.max(best,score);
      alpha = Math.max(alpha,score);

      if (alpha >= beta) break;
    }

    return best;
  }

  function chooseMove() {
    if (!state.history.length) return { r:7,c:7 };

    const config = LEVELS[ui.level.value] || LEVELS.hard;
    const color = state.ai;

    searchWidth = config.width;
    deadline = performance.now() + config.time;

    let moves = orderedMoves(color,searchWidth);
    if (!moves.length) return null;

    if (
      winsAt(moves[0].r,moves[0].c,color) ||
      moves.length === 1
    ) {
      return moves[0];
    }

    let best = moves[0];

    for (let depth = 1; depth <= config.depth; depth++) {
      let iterationBest = null;
      let bestScore = -Infinity;
      let alpha = -Infinity;

      try {
        for (const move of moves) {
          checkTime();
          state.grid[move.r][move.c] = color;
          let score;

          try {
            score = -negamax(
              depth - 1,-Infinity,-alpha,opposite(color),1
            );
          } finally {
            state.grid[move.r][move.c] = 0;
          }

          if (score > bestScore) {
            bestScore = score;
            iterationBest = move;
          }

          alpha = Math.max(alpha,score);
        }

        best = iterationBest || best;

        moves = [
          best,
          ...moves.filter(m => m.r !== best.r || m.c !== best.c)
        ];

        if (bestScore >= WIN - SIZE * SIZE) break;
      } catch (error) {
        if (error !== TIMEOUT) throw error;
        break;
      }
    }

    return best;
  }

  ui.restart.addEventListener("click",reset);
  ui.color.addEventListener("change",reset);
  ui.undo.addEventListener("click",undo);

  buildBoard();
  reset();
})();
</script>
</body>
</html>
