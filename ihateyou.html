<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gomoku IA Extrême</title><style>:root{--p:#f3e9d2;--pd:#e6d5ae;--w:#e2c48d;--i:#8b0000;--k:#2b1d14;--b:min(92vw,560px)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 0 28px;color:var(--k);font-family:Georgia,serif;background:radial-gradient(circle at 20% 10%,#fbf5e6 0,transparent 55%),radial-gradient(circle at 80% 90%,var(--pd) 0,transparent 60%),var(--p)}header{text-align:center}h1{margin:0;font-size:1.8rem;letter-spacing:.2em;color:var(--i)}h1 small{display:block;font-size:.45em;letter-spacing:.15em;color:var(--k);opacity:.7;margin-top:4px}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.control-group{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid rgba(139,0,0,.35);border-radius:99px;background:rgba(255,255,255,.35);font-size:.9rem}select{font:inherit;color:var(--k);background:transparent;border:0;outline:0}.status{min-height:3.2em;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 20px;border:1px solid var(--i);border-radius:99px;background:rgba(255,255,255,.45);font-size:1rem;text-align:center}.status.win{background:var(--i);color:#fbf1d9}.status.thinking{background:rgba(139,0,0,.1)}.dot{width:16px;height:16px;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.4)}.dot.black{background:radial-gradient(circle at 35% 30%,#666,#111 60%)}.dot.white{background:radial-gradient(circle at 35% 30%,#fff,#cfcfcf 70%);border:1px solid #aaa}#board{width:var(--b);height:var(--b);display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);background:linear-gradient(135deg,rgba(255,255,255,.25),transparent 50%),var(--w);border:3px solid var(--i);border-radius:6px;box-shadow:0 18px 40px rgba(60,30,10,.3);touch-action:manipulation}.cell{position:relative;padding:0;margin:0;border:0;background:transparent;cursor:pointer;min-width:0;min-height:0}.cell::before,.cell::after{content:"";position:absolute;background:var(--i);opacity:.75;pointer-events:none}.cell::before{left:0;right:0;top:50%;height:1px}.cell::after{top:0;bottom:0;left:50%;width:1px}.cell.c0::before{left:50%}.cell.c14::before{right:50%}.cell.r0::after{top:50%}.cell.r14::after{bottom:50%}.cell.star .hoshi{position:absolute;left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);background:var(--i);border-radius:50%}.ghost{position:absolute;inset:9%;border-radius:50%;opacity:0;transition:.18s;pointer-events:none;z-index:1}#board.turn-black .ghost{background:#111}#board.turn-white .ghost{background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}#board:not(.over):not(.thinking) .cell:not(.taken):hover .ghost{opacity:.35;transform:scale(1)}.stone{position:absolute;inset:9%;border-radius:50%;z-index:2;pointer-events:none;animation:d .35s both;box-shadow:0 3px 5px rgba(0,0,0,.4)}.stone.black{background:radial-gradient(circle at 35% 30%,#707070,#151515 55%,#000)}.stone.white{background:radial-gradient(circle at 35% 30%,#fff,#ececec 55%,#bdbdbd)}@keyframes d{from{opacity:0;transform:translateY(-18px) scale(1.25)}to{opacity:1;transform:translateY(0) scale(1)}}.stone.last::after{content:"";position:absolute;left:50%;top:50%;width:22%;height:22%;border-radius:50%;transform:translate(-50%,-50%);background:var(--i)}.stone.win{animation:d .35s both,p 1.1s ease-in-out .4s infinite}@keyframes p{0%,100%{box-shadow:0 0 0 0 rgba(139,0,0,.7)}50%{box-shadow:0 0 0 6px rgba(139,0,0,0)}}.actions{display:flex;gap:10px}button.action{font:inherit;font-size:1rem;padding:10px 22px;color:var(--i);background:rgba(255,255,255,.18);border:2px solid var(--i);border-radius:99px;cursor:pointer}button.action:hover{background:var(--i);color:#fbf1d9}button.action:disabled{opacity:.5}.hint{font-size:.85rem;opacity:.78;text-align:center;padding:0 16px;max-width:600px}</style></head><body>
<header><h1>五子棋<small>Gomoku · IA Extrême</small></h1></header>
<div class="controls"><label class="control-group">Vous jouez<select id="humanColor"><option value="black">Noir (先手)</option><option value="white">Blanc (后手)</option></select></label><label class="control-group">Difficulté<select id="difficulty"><option value="normal">Stratégique</option><option value="hard" selected>Extrême</option></select></label></div>
<div class="status" id="status"></div><div id="board" class="turn-black"></div><div class="hint" id="hint">L’IA cherche les victoires forcées et punit les trois ouverts.</div>
<div class="actions"><button class="action" id="restart">Recommencer</button><button class="action" id="undo">Annuler</button></div>
<script>(()=>{'use strict';const S=15,D=[[0,1],[1,0],[1,1],[1,-1]],ST=[[3,3],[3,11],[7,7],[11,3],[11,11]];const B=document.getElementById('board'),St=document.getElementById('status'),H=document.getElementById('hint'),HC=document.getElementById('humanColor'),DF=document.getElementById('difficulty'),U=document.getElementById('undo');let G,C=[],cur,ov,thk,mv,hist=[],hc='black',ac='white',tk=0,lm=null;
function build(){for(let r=0;r<S;r++){C[r]=[];for(let c=0;c<S;c++){const el=document.createElement('button');el.className='cell'+(c===0?' c0':'')+(c===14?' c14':'')+(r===0?' r0':'')+(r===14?' r14':'');if(ST.some(([sr,sc])=>sr===r&&sc===c)){el.classList.add('star');const h=document.createElement('span');h.className='hoshi';el.appendChild(h)}const g=document.createElement('span');g.className='ghost';el.appendChild(g);el.onclick=()=>playHuman(r,c);B.appendChild(el);C[r][c]=el}}}
function reset(){tk++;G=Array.from({length:S},()=>Array(S).fill(null));cur='black';ov=false;thk=false;mv=0;hist=[];lm=null;B.classList.remove('over','thinking');B.classList.add('turn-black');for(const row of C)for(const el of row){el.classList.remove('taken');el.querySelector('.stone')?.remove()}hc=HC.value;ac=hc==='black'?'white':'black';U.disabled=true;upd();if(hc==='white')sched()}
function ib(r,c){return r>=0&&r<S&&c>=0&&c<S}
function place(r,c,col){if(lm)C[lm.r][lm.c].querySelector('.stone')?.classList.remove('last');const s=document.createElement('span');s.className=`stone ${col} last`;C[r][c].appendChild(s);C[r][c].classList.add('taken');lm={r,c,col}}
function move(r,c,col){if(ov||G[r][c])return false;G[r][c]=col;mv++;hist.push({r,c,col});place(r,c,col);const line=win(r,c,col);if(line){ov=true;hl(line);B.classList.add('over');upd({winner:col});return true}if(mv===S*S){ov=true;B.classList.add('over');upd({draw:true});return true}cur=col==='black'?'white':'black';upd();return true}
function playHuman(r,c){if(ov||thk||cur!==hc||G[r][c])return;if(move(r,c,hc)&&!ov)sched()}
function win(r,c,col){for(const[dr,dc]of D){const line=[[r,c]];for(const s of[1,-1]){let nr=r+dr*s,nc=c+dc*s;while(ib(nr,nc)&&G[nr][nc]===col){line.push([nr,nc]);nr+=dr*s;nc+=dc*s}}if(line.length>=5)return line.slice(0,5)}return null}
function hl(l){for(const[r,c]of l)C[r][c].querySelector('.stone')?.classList.add('win')}
function upd(res={}){St.classList.toggle('win',!!res.winner);St.classList.toggle('thinking',thk);if(res.winner){St.innerHTML=res.winner===hc?'<span class="dot black"></span><span>Victoire !</span>':'<span class="dot white"></span><span>L’IA gagne.</span>';H.textContent=res.winner===hc?'Incroyable, tu as battu l\'IA.':'L\'IA a trouvé une faille.';return}if(res.draw){St.textContent='Match nul';return}if(thk){St.innerHTML=`<span class="dot ${ac}"></span><span>L’IA analyse…</span>`;return}St.innerHTML=`<span class="dot ${cur}"></span><span>Tour : ${cur===hc?'Vous':'Ordinateur'}</span>`;B.classList.toggle('turn-black',cur==='black');B.classList.toggle('turn-white',cur==='white');U.disabled=thk||hist.length===0}
function sched(){if(ov)return;thk=true;B.classList.add('thinking');upd();const t=++tk;setTimeout(()=>{if(t!==tk||ov)return;const m=choose();thk=false;B.classList.remove('thinking');if(m)move(m.r,m.c,ac);if(!ov)upd()},60)}
function undo(){if(thk||hist.length===0)return;tk++;ov=false;thk=false;let rc=1;if(hist[hist.length-1].col===ac&&hist.length>=2)rc=2;for(let i=0;i<rc&&hist.length;i++){const m=hist.pop();G[m.r][m.c]=null;C[m.r][m.c].classList.remove('taken');C[m.r][m.c].querySelector('.stone')?.remove();mv--}lm=hist.length?{...hist[hist.length-1]}:null;if(lm)C[lm.r][lm.c].querySelector('.stone')?.classList.add('last');B.classList.remove('over','thinking');cur=hist.length?(hist[hist.length-1].col==='black'?'white':'black'):'black';upd();if(cur===ac)sched()}
const WS=1e9,FS=120000,OS=18000,TS=3500,OT=800,TW=120,CFG={normal:{dep:4,t:250,c:10,v:4},hard:{dep:10,t:1600,c:16,v:8}};let DL=0;const opp=c=>c==='black'?'white':'black';
function evalB(){let a=0,h=0,L=[];for(let r=0;r<S;r++)L.push(Array.from({length:S},(_,c)=>[r,c]));for(let c=0;c<S;c++)L.push(Array.from({length:S},(_,r)=>[r,c]));for(let s=0;s<S;s++){const d1=[],d2=[];for(let i=0;i<S;i++){if(s+i<S)d1.push([s+i,i]);if(s+i<S)d2.push([s+i,S-1-i])}if(d1.length>=5)L.push(d1);if(d2.length>=5)L.push(d2)}for(let s=1;s<S;s++){const d1=[],d2=[];for(let i=0;i<S;i++){if(s+i<S)d1.push([i,s+i]);if(s-1-i>=0)d2.push([i,s-1-i])}if(d1.length>=5)L.push(d1);if(d2.length>=5)L.push(d2)}
const pt=(n,e)=>n>=5?WS:n===4?(e>=1?FS:FS*.3):n===3?(e===2?OS:TS):n===2?(e===3?OT:TW):n*5;
for(const l of L)for(let i=0;i<=l.length-5;i++){let a1=0,h1=0;for(let j=i;j<i+5;j++){const[r,c]=l[j];if(G[r][c]===ac)a1++;else if(G[r][c]===hc)h1++}if(a1&&h1)continue;if(a1)a+=pt(a1,5-a1);else if(h1)h+=pt(h1,5-h1)}return a-h*1.18}
function chk(r,c,col){for(const[dr,dc]of D){let n=1;for(const s of[1,-1]){let nr=r+dr*s,nc=c+dc*s;while(ib(nr,nc)&&G[nr][nc]===col){n++;nr+=dr*s;nc+=dc*s}}if(n>=5)return true}return false}
function wMoves(col){const res=[];for(let r=0;r<S;r++)for(let c=0;c<S;c++){if(G[r][c])continue;G[r][c]=col;if(chk(r,c,col))res.push({r,c});G[r][c]=null}return res}
function cF(r,c,col){G[r][c]=col;let f=false;for(const[dr,dc]of D){let n=1,o=0;for(const s of[1,-1]){let nr=r+dr*s,nc=c+dc*s;while(ib(nr,nc)&&G[nr][nc]===col){n++;nr+=dr*s;nc+=dc*s}if(ib(nr,nc)&&!G[nr][nc])o++}if(n>=4&&o>=1){f=true;break}}G[r][c]=null;return f}
function cT(r,c,col){G[r][c]=col;let f=false;for(const[dr,dc]of D){let n=1,o=0;for(const s of[1,-1]){let nr=r+dr*s,nc=c+dc*s;while(ib(nr,nc)&&G[nr][nc]===col){n++;nr+=dr*s;nc+=dc*s}if(ib(nr,nc)&&!G[nr][nc])o++}if(n===3&&o===2){f=true;break}}G[r][c]=null;return f}
function emp(rg=2){const res=[];for(let r=0;r<S;r++)for(let c=0;c<S;c++){if(G[r][c])continue;let nr=false;for(let dr=-rg;dr<=rg&&!nr;dr++)for(let dc=-rg;dc<=rg;dc++){const ar=r+dr,ac2=c+dc;if(ib(ar,ac2)&&G[ar][ac2]){nr=true;break}}if(nr)res.push({r,c})}return res}
function qS(r,c,col){const o=opp(col);let s=0;if(cF(r,c,col))s+=90000;if(cF(r,c,o))s+=85000;if(cT(r,c,col))s+=12000;if(cT(r,c,o))s+=11000;G[r][c]=col;s+=evalB()*.01;G[r][c]=null;s+=(7-Math.abs(r-7)-Math.abs(c-7))*2;return s}
function ord(col,lim){return emp(2).map(cell=>({...cell,score:qS(cell.r,cell.c,col)})).sort((a,b)=>b.score-a.score).slice(0,lim)}
function vcf(col,dep){if(Date.now()>DL)return null;const w=wMoves(col);if(w.length)return w[0];if(dep<=0)return null;for(const cell of emp(2)){if(!cF(cell.r,cell.c,col))continue;G[cell.r][cell.c]=col;const th=wMoves(col);if(th.length>=2){G[cell.r][cell.c]=null;return cell}if(th.length===1){const bl=th[0];G[bl.r][bl.c]=opp(col);const rp=vcf(col,dep-1);G[bl.r][bl.c]=null;G[cell.r][cell.c]=null;if(rp)return cell}else{G[cell.r][cell.c]=null}}return null}
function vct(col,dep){if(Date.now()>DL)return null;const w=wMoves(col);if(w.length)return w[0];if(dep<=0)return null;const v=vcf(col,Math.min(dep,6));if(v)return v;for(const m of ord(col,10)){if(!cT(m.r,m.c,col)&&!cF(m.r,m.c,col))continue;G[m.r][m.c]=col;const th=wMoves(col);if(th.length>=2){G[m.r][m.c]=null;return m}const df=ord(opp(col),6);let all=df.length>0;for(const d of df){G[d.r][d.c]=opp(col);const rp=vct(col,dep-1);G[d.r][d.c]=null;if(!rp){all=false;break}}G[m.r][m.c]=null;if(all)return m}return null}
function ng(dep,al,be,col){if(Date.now()>DL)return 0;if(dep===0){const s=evalB();return col===ac?s:-s}const mvs=ord(col,CFG[DF.value].c);if(mvs.length===0)return 0;let bs=-Infinity;for(const m of mvs){G[m.r][m.c]=col;if(chk(m.r,m.c,col)){G[m.r][m.c]=null;return WS-(10-dep)}let sc=-ng(dep-1,-be,-al,opp(col));G[m.r][m.c]=null;bs=Math.max(bs,sc);al=Math.max(al,sc);if(al>=be)break}return bs}
function choose(){if(mv===0)return{r:7,c:7};const md=DF.value,cfg=CFG[md];DL=Date.now()+cfg.t;const mw=wMoves(ac);if(mw.length>0)return mw[0];const ow=wMoves(hc);if(ow.length>0)return ow[0];if(md==='hard'){const v=vcf(ac,cfg.v);if(v)return v;const t=vct(ac,cfg.v);if(t)return t}let bm=null,rm=ord(ac,cfg.c);for(let d=1;d<=cfg.dep;d++){let cbm=null,cbs=-Infinity,al=-Infinity;for(const m of rm){if(Date.now()>DL)break;G[m.r][m.c]=ac;let sc;if(chk(m.r,m.c,ac))sc=WS+d;else sc=-ng(d-1,-Infinity,-al,hc);G[m.r][m.c]=null;if(sc>cbs){cbs=sc;cbm=m}al=Math.max(al,sc)}if(Date.now()>DL&&bm)break;if(cbm){bm=cbm;rm=[bm,...rm.filter(m=>m.r!==bm.r||m.c!==bm.c)]}if(cbs>=WS-100)break}return bm||rm[0]}
document.getElementById('restart').onclick=reset;U.onclick=undo;HC.onchange=reset;build();reset()})();</script></body></html>
